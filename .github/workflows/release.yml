name: Release

on:
  workflow_run:
    workflows:
      - Verify
    types:
      - completed
  workflow_dispatch:

run-name: Release Hope (recorded version)

permissions:
  contents: write

concurrency:
  group: hope-release
  queue: max

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Require the intended release source
        env:
          EVENT_REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          SOURCE_EVENT: ${{ github.event.workflow_run.event }}
        run: |
          test "$(git rev-parse HEAD)" = "${EVENT_SHA}"
          if [ "${EVENT_NAME}" = "workflow_run" ]; then
            test "${SOURCE_EVENT}" = "push"
            test "${HEAD_BRANCH}" = "main"
            test "${HEAD_REPOSITORY}" = "${GITHUB_REPOSITORY}"
          else
            test "${EVENT_REF}" = "refs/heads/main"
          fi
      - name: Choose release mode
        id: plan
        env:
          EVENT_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT_VERSION="$(node -p "require('./package.json').version")"
          CURRENT_TAG="v${CURRENT_VERSION}"
          TAG_EXISTS=false
          if git rev-parse --verify --quiet "refs/tags/${CURRENT_TAG}^{commit}" > /dev/null; then
            TAG_EXISTS=true
          fi
          RELEASE_STATE="$(gh api graphql \
            -f owner="${GITHUB_REPOSITORY_OWNER}" \
            -f name="${GITHUB_REPOSITORY#*/}" \
            -f tag="${CURRENT_TAG}" \
            -f query='query($owner: String!, $name: String!, $tag: String!) {
              repository(owner: $owner, name: $name) {
                release(tagName: $tag) { isDraft }
              }
            }' \
            --jq '.data.repository.release | if . == null then "missing" elif .isDraft then "draft" else "published" end')"
          PREVIOUS_VERSION=""
          if [ "${EVENT_NAME}" = "workflow_run" ]; then
            if git rev-parse --verify --quiet "${EVENT_SHA}^" > /dev/null; then
              PREVIOUS_VERSION="$(git show "${EVENT_SHA}^:package.json" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")"
            fi
          fi
          CURRENT_VERSION="${CURRENT_VERSION}" \
          PREVIOUS_VERSION="${PREVIOUS_VERSION}" \
          TAG_EXISTS="${TAG_EXISTS}" \
          RELEASE_STATE="${RELEASE_STATE}" \
          node tools/plan-release.mjs
      - name: Restore interrupted release source
        if: steps.plan.outputs.mode == 'resume'
        run: git checkout --detach "${{ steps.plan.outputs.current-tag }}"
      - name: Check recorded package
        if: steps.plan.outputs.publish == 'true'
        run: |
          test "$(node -p "require('./package.json').version")" = "${{ steps.plan.outputs.current-version }}"
          if git rev-parse --verify --quiet "refs/tags/${{ steps.plan.outputs.current-tag }}^{commit}" > /dev/null; then
            if [ "${{ steps.plan.outputs.mode }}" != "resume" ]; then
              echo "Release tag ${{ steps.plan.outputs.current-tag }} already exists unexpectedly" >&2
              exit 1
            fi
            test "$(git rev-parse HEAD)" = "$(git rev-parse "${{ steps.plan.outputs.current-tag }}^{commit}")"
          elif [ "${{ steps.plan.outputs.mode }}" = "resume" ]; then
            echo "Release tag ${{ steps.plan.outputs.current-tag }} disappeared before recovery" >&2
            exit 1
          fi
          node tools/check-release.mjs
      - name: Stage plugin package
        if: steps.plan.outputs.publish == 'true'
        run: node tools/stage-plugin.mjs "${RUNNER_TEMP}/hope-package"
      - name: Package plugin
        if: steps.plan.outputs.publish == 'true'
        working-directory: ${{ runner.temp }}/hope-package
        run: zip -r "${GITHUB_WORKSPACE}/hope-${{ steps.plan.outputs.current-tag }}.zip" .
      - name: Check package root
        if: steps.plan.outputs.publish == 'true'
        run: |
          unzip -t "hope-${{ steps.plan.outputs.current-tag }}.zip" > /dev/null
          unzip -Z1 "hope-${{ steps.plan.outputs.current-tag }}.zip" | sed '/\/$/d' | sort > "${RUNNER_TEMP}/plugin-package-files.txt"
          diff -u tools/plugin-package-files.txt "${RUNNER_TEMP}/plugin-package-files.txt"
          sha256sum "hope-${{ steps.plan.outputs.current-tag }}.zip" > "hope-${{ steps.plan.outputs.current-tag }}.zip.sha256"
      - name: Publish recorded release
        if: steps.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.plan.outputs.mode }}" != "resume" ]; then
            git tag "${{ steps.plan.outputs.current-tag }}"
            git push origin "${{ steps.plan.outputs.current-tag }}"
          fi
          gh release create "${{ steps.plan.outputs.current-tag }}" \
            "hope-${{ steps.plan.outputs.current-tag }}.zip" \
            "hope-${{ steps.plan.outputs.current-tag }}.zip.sha256" \
            --title "Hope ${{ steps.plan.outputs.current-tag }}" \
            --generate-notes \
            --fail-on-no-commits \
            --latest \
            --verify-tag
