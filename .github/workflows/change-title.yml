name: Change title

on:
  push:
    branches:
      - main
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  check:
    name: AI-readable change title
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Check the pull request or main head title
        env:
          HOPE_CHANGE_TITLE: ${{ github.event.pull_request.title || github.event.head_commit.message }}
        run: node tools/check-change-title.mjs
